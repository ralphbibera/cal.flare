# pull_request_target loads main's workflow before checking out this PR's action implementations.
name: Bun install compatibility entrypoint
description: "Delegate the base workflow's former action path to Bun"
inputs:
  node_version:
    required: false
    default: "24.22.0"
  skip-install-if-cache-hit:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/bun-install
      with:
        node_version: ${{ inputs.node_version }}
        skip-install-if-cache-hit: ${{ inputs.skip-install-if-cache-hit }}
