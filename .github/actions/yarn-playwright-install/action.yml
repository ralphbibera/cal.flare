# Keep main's pull_request_target callers working while their action names migrate.
name: Bun Playwright compatibility entrypoint
description: "Delegate the base workflow's former action path to Bun"
inputs:
  skip-install-if-cache-hit:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/bun-playwright-install
      with:
        skip-install-if-cache-hit: ${{ inputs.skip-install-if-cache-hit }}
