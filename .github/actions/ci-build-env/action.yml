name: CI build environment
description: Prepare isolated compile-only crypto when CI secrets are unavailable
runs:
  using: composite
  steps:
    - name: Prepare compile-only signing and encryption keys
      shell: bash
      run: |
        set -euo pipefail
        NEXTAUTH_SECRET="${NEXTAUTH_SECRET:-$(node -p 'require("node:crypto").randomBytes(32).toString("base64")')}"
        # symmetricEncrypt consumes 32 Latin-1 bytes, not a hex-decoded key.
        CALENDSO_ENCRYPTION_KEY="${CALENDSO_ENCRYPTION_KEY:-$(node -p 'require("node:crypto").randomBytes(24).toString("base64")')}"
        printf '::add-mask::%s\n' "$NEXTAUTH_SECRET" "$CALENDSO_ENCRYPTION_KEY"
        printf 'NEXTAUTH_SECRET=%s\nCALENDSO_ENCRYPTION_KEY=%s\n' "$NEXTAUTH_SECRET" "$CALENDSO_ENCRYPTION_KEY" >> "$GITHUB_ENV"
