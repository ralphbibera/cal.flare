name: "vinext Bundle Analysis Annotation"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/production-build-without-database.yml
    secrets: inherit

  annotate:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Download current bundle stats
        uses: actions/download-artifact@v4
        with:
          name: bundle
          path: apps/web/dist/analyze

      - name: Download base branch bundle stats
        uses: dawidd6/action-download-artifact@v6
        if: success()
        with:
          workflow: vinext-bundle-analysis.yml
          name: bundle
          branch: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          path: apps/web/dist/analyze/base

      - name: Compare with base branch bundle
        if: success()
        run: |
          cd apps/web
          bun run scripts/bundle-analysis.ts compare dist/analyze/base dist/analyze >> "$GITHUB_STEP_SUMMARY"

      - name: Get comment body
        id: get-comment-body
        if: success() && github.event.number
        run: |
          cd apps/web
          {
            echo 'body<<CALFLARE_BUNDLE_COMMENT'
            cat dist/analyze/__bundle_analysis_comment.md
            echo 'CALFLARE_BUNDLE_COMMENT'
          } >> "$GITHUB_OUTPUT"

      - name: Find Comment
        uses: peter-evans/find-comment@v2
        if: success() && github.event.number
        id: fc
        with:
          issue-number: ${{ github.event.number }}
          body-includes: "<!-- __VINEXT_BUNDLE_@calcom/web -->"

      - name: Create Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.fc.outputs.comment-id == 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}

      - name: Update Comment
        uses: peter-evans/create-or-update-comment@v5
        if: success() && github.event.number && steps.fc.outputs.comment-id != 0
        with:
          issue-number: ${{ github.event.number }}
          body: ${{ steps.get-comment-body.outputs.body }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
