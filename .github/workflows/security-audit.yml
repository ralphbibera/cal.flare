name: Security Audit
on:
  workflow_call:
permissions:
  actions: write
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/bun-install
      - name: Report all vulnerabilities
        run: bun audit || true
      - name: Fail on critical vulnerabilities
        run: bun audit --audit-level critical
