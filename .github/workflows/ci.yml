name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC
  WRANGLER_SEND_METRICS: false

jobs:
  integration:
    name: Bun and D1 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install with pinned Bun
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check:ci --force
      - name: Verify local D1
        run: bun run test
      - name: Verify SQLite reservations
        run: bun run test:sqlite

  browser:
    name: Worker and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install with pinned Bun
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Verify built Worker
        run: bun run verify:worker
      - name: Install Chromium
        run: bun run --cwd apps/flare playwright install --with-deps --only-shell chromium
      - name: Verify browser journeys and UI parity
        run: |
          git fetch --no-tags --depth=1 origin 0f19cc46ef6b6426ee398c670575b3c96be7af9e
          bun run verify:ui

  checks:
    name: Astro and Workers checks
    if: ${{ always() }}
    needs: [integration, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - name: Require both verification lanes
        run: test "$INTEGRATION_RESULT" = success && test "$BROWSER_RESULT" = success
