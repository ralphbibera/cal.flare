name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC
  WRANGLER_SEND_METRICS: false

jobs:
  checks:
    name: Astro and Workers checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Install with Yarn 4.12.0
        run: node .yarn/releases/yarn-4.12.0.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-4.12.0.cjs lint
      - name: Type check
        run: node .yarn/releases/yarn-4.12.0.cjs type-check:ci --force
      - name: Verify local D1
        run: node .yarn/releases/yarn-4.12.0.cjs test
      - name: Verify SQLite reservations
        run: node .yarn/releases/yarn-4.12.0.cjs test:sqlite
      - name: Build
        run: node .yarn/releases/yarn-4.12.0.cjs build
      - name: Verify built Worker
        run: node .yarn/releases/yarn-4.12.0.cjs verify:worker
      - name: Install Chromium
        run: node .yarn/releases/yarn-4.12.0.cjs workspace @calflare/web exec playwright install --with-deps --only-shell chromium
      - name: Capture upstream UI reference
        run: |
          git fetch --no-tags --depth=1 origin 0f19cc46ef6b6426ee398c670575b3c96be7af9e
          node .yarn/releases/yarn-4.12.0.cjs verify:ui
