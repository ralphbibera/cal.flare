name: Setup Database

on:
  workflow_call:
    inputs:
      DB_CACHE_HIT:
        required: false
        type: string
        default: "false"
        description: "Whether the DB cache was hit (skip bun-install and cache-db if true)"

permissions:
  contents: read

jobs:
  setup-db:
    name: Setup Database
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Retained suites run on Miniflare D1; the legacy PostgreSQL seed is not used."
