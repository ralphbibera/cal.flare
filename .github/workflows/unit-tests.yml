name: Unit
on:
  workflow_call:
env:
  LINGO_DOT_DEV_API_KEY: ${{ secrets.CI_LINGO_DOT_DEV_API_KEY }}
permissions:
  contents: read
jobs:
  test:
    name: Unit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/bun-install
      - run: bun run prisma generate
      - name: Build embed snippet package
        working-directory: packages/embeds/embed-snippet
        run: |
          bun run vite build
          bun run tsc --emitDeclarationOnly --declarationDir dist
      - name: Build React embed package
        working-directory: packages/embeds/embed-react
        run: |
          bun run vite build
          cp dist/Cal.es.js dist/Cal.es.mjs
          bun run tsc --emitDeclarationOnly --declarationDir dist
      - run: bun run test
      # We could add different timezones here that we need to run our tests in
      - run: TZ=America/Los_Angeles VITEST_MODE=timezone bun run vitest run
