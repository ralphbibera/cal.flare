on:
  workflow_call:
    inputs:
      source_run_id:
        description: 'The source run ID for report path'
        required: true
        type: string
      source_run_number:
        description: 'The source run number for artifact naming and comment'
        required: true
        type: string
      source_run_attempt:
        description: 'The source run attempt for artifact naming and comment'
        required: true
        type: string
permissions:
  actions: read
jobs:
  publish-report:
    runs-on: ubuntu-latest
    steps:
      - name: Link retained HTML report
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: html-report--attempt-${{ inputs.source_run_number }}-${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const artifact = artifacts.find(a => a.name === process.env.ARTIFACT_NAME && !a.expired);
            if (!artifact) {
              core.setFailed('Merged HTML report artifact is missing or expired');
              return;
            }
            const runsUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs`;
            await core.summary
              .addHeading('Playwright HTML report')
              .addLink('Download HTML report', `${runsUrl}/${context.runId}/artifacts/${artifact.id}`)
              .addBreak()
              .addLink('Source test run', `${runsUrl}/${encodeURIComponent(process.env.SOURCE_RUN_ID)}`)
              .write();
