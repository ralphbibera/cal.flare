name: Check Prisma Migrations
on:
  workflow_call:

jobs:
  check-prisma-migrations:
    name: Check migrations match schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/cache-checkout
      - uses: ./.github/actions/bun-install
      # D1 replaces the PostgreSQL shadow database: the ordered D1 history must reproduce from schema.prisma.
      - name: Check if migrations match schema
        working-directory: packages/prisma
        run: bun run generate-d1-domain --check
